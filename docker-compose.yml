services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: helpdesk
      MYSQL_USER: helpdesk
      MYSQL_PASSWORD: helpdesk_local_password
      MYSQL_ROOT_PASSWORD: helpdesk_local_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 20M
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./helpdesk-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Helpdesk
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: helpdesk
      DB_USERNAME: helpdesk
      DB_PASSWORD: helpdesk_local_password
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_storage:/var/www/html/storage/app/public

  web:
    build:
      context: ./helpdesk_app
      args:
        API_BASE_URL: http://localhost:8080/api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mysql_data:
  api_storage:
